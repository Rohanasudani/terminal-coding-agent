[termagent]
provider = "repair"
model = "gpt-5.6-luna"
approval_mode = "suggest"
max_steps = 12
test_command = "{python} -m pytest -q"
provider_retries = 2
prompt_profile = "conservative"
max_cost_usd = 0.25
max_validation_errors = 2
observation_limit = 6
max_observation_chars = 8000
allow_network_commands = false
log_dir = ".termagent/traces"
