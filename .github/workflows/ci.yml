name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Benchmark
        run: termagent bench --repo-root .

      - name: Compile
        run: python -m compileall -q src tests

      - name: Build and test isolated wheel installation
        run: |
          python -m pip wheel . --wheel-dir .termagent/release-wheels
          python scripts/check_wheel.py

      - name: Safety smoke scan
        run: |
          if rg -n "shell\\s*=\\s*True|(^|[^.[:alnum:]_])(eval|exec)\\(|(^|[^[:alnum:]_])pickle([^[:alnum:]_]|$)" src; then
            exit 1
          fi
