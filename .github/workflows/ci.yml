name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Security smoke
        run: |
          python -c "from pathlib import Path; bad=('shell=True','eval(','exec(','pickle'); hits=[str(p) for p in Path('src').rglob('*.py') if any(item in p.read_text(encoding='utf-8') for item in bad)]; raise SystemExit('\\n'.join(hits) if hits else 0)"

      - name: Unit tests
        run: pytest -q

      - name: Benchmark smoke
        run: termagent bench --repo-root .
